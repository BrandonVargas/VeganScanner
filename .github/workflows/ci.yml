name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shared-and-android:
    name: Shared + Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Lint, test and build
        run: >
          ./gradlew
          spotlessCheck
          testAndroidHostTest
          :androidApp:testDebugUnitTest
          :androidApp:lintDebug
          :androidApp:assembleDebug
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            **/build/reports/
            **/build/test-results/

  ios:
    name: iOS
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Shared tests on iOS simulator
        run: ./gradlew iosSimulatorArm64Test
      - name: Xcode project is in sync with project.yml
        run: |
          brew install xcodegen
          cd iosApp && xcodegen && git diff --exit-code -- VeganScanner.xcodeproj
      - name: iOS unit + offline UI tests
        working-directory: iosApp
        # testNonVeganProductShowsReasons calls the live Open Food Facts API and runs locally only.
        run: >
          xcodebuild test
          -project VeganScanner.xcodeproj
          -scheme VeganScanner
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
          -only-testing:VeganScannerTests
          -only-testing:VeganScannerUITests/ScanFlowUITests/testInvalidBarcodeShowsValidationError
          -resultBundlePath build/TestResults.xcresult
          CODE_SIGNING_ALLOWED=NO
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: iosApp/build/TestResults.xcresult
