# Source of truth for the Xcode project. Regenerate with: `cd iosApp && xcodegen`
name: VeganScanner
options:
  bundleIdPrefix: dev.brandonvargas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Configuration/Config.xcconfig
  Release: Configuration/Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  VeganScanner:
    type: application
    platform: iOS
    sources:
      - path: VeganScanner
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED environment variable set to \"YES\""
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:umbrella:embedAndSignAppleFrameworkForXcode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.brandonvargas.veganscanner
        PRODUCT_NAME: VeganScanner
        INFOPLIST_KEY_CFBundleDisplayName: Vegan Scanner
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: VeganScanner/Info.plist
        INFOPLIST_KEY_NSCameraUsageDescription: "Vegan Scanner uses the camera to read product barcodes."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/umbrella/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        # FoundationModels exists from iOS 26 only; weak-linked so the app still launches on iOS 17-18.
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "VeganKit", "-weak_framework", "FoundationModels"]
  VeganScannerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VeganScannerTests
    dependencies:
      - target: VeganScanner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/umbrella/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VeganScanner.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/VeganScanner"
        BUNDLE_LOADER: "$(TEST_HOST)"
  VeganScannerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VeganScannerUITests
    dependencies:
      - target: VeganScanner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: VeganScanner
schemes:
  VeganScanner:
    build:
      targets:
        VeganScanner: all
        VeganScannerTests: [test]
        VeganScannerUITests: [test]
    test:
      targets:
        - VeganScannerTests
        - VeganScannerUITests
      language: en
